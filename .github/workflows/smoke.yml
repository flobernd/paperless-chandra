name: Smoke (paperless-ngx)

# Runs inside the real paperless-ngx image so we catch API drift in
# the paperless parser-plugin surface that the lightweight unit suite
# (which never imports Django/paperless) cannot. chandra-ocr and its
# pure-python dependencies install alongside paperless's pinned packages.
# The smoke test exercises entry-point discovery, import wiring and one
# page through the pipeline against an in-process stub server.

on:
  push:
    branches: [master]
  # No branch filter, so a pull request whose base is another branch of a
  # stack runs too. The push trigger keeps its filter, so such a branch
  # does not run twice.
  pull_request:
  # The job runs against :latest, so a weekly run catches a paperless-ngx
  # release that breaks the plugin while this repository sees no push.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Import + entry-point smoke
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/paperless-ngx/paperless-ngx:latest
      # paperless's s6 entrypoint would try to boot the whole app; we only
      # want a shell to run the smoke script.
      options: --entrypoint /bin/bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate paperless Python
        id: py
        run: |
          if [ -x /usr/src/paperless/.venv/bin/python ]; then
            echo "bin=/usr/src/paperless/.venv/bin/python" >> "$GITHUB_OUTPUT"
          else
            echo "bin=$(command -v python3)" >> "$GITHUB_OUTPUT"
          fi

      - name: Install package
        run: |
          "${{ steps.py.outputs.bin }}" -m pip install --break-system-packages .

      # The smoke test constructs the parser, and OcrConfig() reads the
      # application configuration from the database.
      - name: Migrate the SQLite database
        env:
          PYTHONPATH: /usr/src/paperless/src
          DJANGO_SETTINGS_MODULE: paperless.settings
          PAPERLESS_REDIS: redis://localhost:6379
          PAPERLESS_DBENGINE: sqlite
          PAPERLESS_SECRET_KEY: smoke-test-not-a-real-secret
          # django-treenode's post_migrate handler reads the Django cache,
          # which is Redis by default, and the job runs no Redis.
          PAPERLESS_CACHE_BACKEND: django.core.cache.backends.locmem.LocMemCache
          PAPERLESS_DATA_DIR: /tmp/paperless-data
        run: |
          mkdir -p /tmp/paperless-data
          "${{ steps.py.outputs.bin }}" /usr/src/paperless/src/manage.py migrate --noinput

      - name: Run smoke test
        env:
          PYTHONPATH: /usr/src/paperless/src
          DJANGO_SETTINGS_MODULE: paperless.settings
          # Settings so the smoke test runs without live services. The parser
          # reads the SQLite database that the migration step created, and the
          # in-process cache keeps Redis out.
          PAPERLESS_REDIS: redis://localhost:6379
          PAPERLESS_DBENGINE: sqlite
          PAPERLESS_SECRET_KEY: smoke-test-not-a-real-secret
          PAPERLESS_CACHE_BACKEND: django.core.cache.backends.locmem.LocMemCache
          PAPERLESS_DATA_DIR: /tmp/paperless-data
          PAPERLESS_OCR_LANGUAGE: eng
        run: |
          "${{ steps.py.outputs.bin }}" tests/smoke_paperless.py
